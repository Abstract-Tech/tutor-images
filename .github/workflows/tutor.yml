name: Build and Push docker & tutor installed images

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Docker image version (e.g., alpha, beta, latest, 1.0.0, etc.)'
        required: true
        type: string
        default: 'latest'

jobs:
  build-image:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Registry
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: abstract2tech
          password: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}

      - name: Build image and push to Docker Hub
        run: |
          docker build -t abstract2tech/tutor-ci:${{ github.event.inputs.version }} .
          docker push abstract2tech/tutor-ci:${{ github.event.inputs.version }}
